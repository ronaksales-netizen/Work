<head>
<meta charset="UTF-8">

<title>Operation Desk</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* =========================================================
   SETTINGS - Apps Script Web App URL yahan paste karein.
   Khali chhodne par "Demo mode" chalega (data sirf is browser me).
   ========================================================= */
</style>
<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxEloIqYjpJPXB3nSZ9e8ej4KXUCyasrCTD6ZBRXWkvjks0YMPmnYVi3Q8nth-EJxOiHQ/exec";
</script>

<style>
:root{
  --ink:#1F2A44;        /* navy ink */
  --ink-2:#4A5570;
  --muted:#7A8399;
  --line:#D9DEE8;
  --paper:#FFFFFF;
  --bg:#EEF1F6;
  --accent:#C8871A;     /* marigold */
  --accent-soft:#FBF1DE;
  --danger:#B3261E;
  --ok:#2E7D4F;
  --side:#1F2A44;
  --side-text:#C9D1E3;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--side);padding:20px;z-index:50}
.login-card{background:var(--paper);width:100%;max-width:380px;padding:32px 28px;border-radius:6px}
.login-card h1{font-family:var(--serif);font-size:28px;margin:0 0 4px}
.login-card p{margin:0 0 22px;color:var(--muted)}
.login-card input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:4px;margin-bottom:12px;background:#fff}
.login-err{color:var(--danger);min-height:20px;font-size:14px}

/* ---------- App shell ---------- */
#app{display:none;min-height:100%;grid-template-columns:230px 1fr}
#app.on{display:grid}
aside{background:var(--side);color:var(--side-text);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{padding:0 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.brand b{display:block;font-family:var(--serif);font-size:22px;color:#fff;font-weight:600}
.brand span{font-size:13px}
.nav-btn{display:block;width:100%;text-align:left;background:none;border:0;color:var(--side-text);padding:10px 12px;border-radius:4px;cursor:pointer}
.nav-btn:hover{background:rgba(255,255,255,.07)}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:10px;font-size:13px}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 12px;border-radius:4px;cursor:pointer;margin-top:8px}
main{padding:26px 30px 60px;min-width:0}
.demo-bar{background:var(--accent-soft);border:1px solid #EAD3A6;color:#6B4A0E;padding:9px 14px;border-radius:4px;margin-bottom:18px;font-size:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h2{font-family:var(--serif);font-size:30px;margin:0;font-weight:600;line-height:1.1}
.top .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:4px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2C3A5C}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}

/* ---------- List ---------- */
.list-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.list-head input{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.count{color:var(--ink-2);font-size:14px}
.table-wrap{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;background:#F8F9FC}
tr:last-child td{border-bottom:0}
td.reg{font-weight:600;white-space:nowrap}
td.row-act{white-space:nowrap;text-align:right}
td.row-act .btn{margin-left:4px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- Paper form (entry looks like the printed form) ---------- */
#editor{display:none}
#editor.on{display:block}
.sheet{background:var(--paper);max-width:760px;margin:0 auto;padding:36px 44px 40px;border:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(31,42,68,.35)}
.sheet-head{text-align:center;font-family:var(--serif);margin-bottom:26px}
.sheet-head .l1{font-size:22px;font-weight:700}
.sheet-head .l2{font-size:19px;font-weight:600;margin-top:2px}
.sheet-head .l3{font-size:19px;font-weight:700;margin-top:2px}
.sheet-reg{display:flex;justify-content:space-between;font-family:var(--serif);font-size:15px;margin-bottom:14px;color:var(--ink-2)}
.f-row{display:grid;grid-template-columns:190px 14px 1fr;align-items:end;gap:6px;margin-bottom:9px;font-family:var(--serif);font-size:16px}
.f-row label{padding-bottom:5px}
.f-row .colon{padding-bottom:5px}
.f-row input,.f-row textarea{width:100%;border:0;border-bottom:1.5px solid #8E97AD;padding:5px 2px;background:transparent;font-family:var(--sans);font-size:15px;border-radius:0}
.f-row textarea{resize:vertical;min-height:34px;line-height:1.4}
.f-row input:focus,.f-row textarea:focus{outline:none;border-bottom-color:var(--accent);background:var(--accent-soft)}
.f-row.sign{margin-top:28px}
.sign-line{border-bottom:1.5px solid #8E97AD;height:30px}
.editor-bar{max-width:760px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.editor-bar h3{margin:0;font-size:18px}
.editor-foot{max-width:760px;margin:16px auto 0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Toast & dialog ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:4px;opacity:0;transition:.25s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}
#busy{position:fixed;inset:0;background:rgba(238,241,246,.6);display:none;place-items:center;z-index:40;font-weight:600}
#busy.on{display:grid}

/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  #app,#login,#toast,#busy{display:none!important}
  #printArea{display:block}
  .p-page{page-break-after:always;font-family:"Times New Roman",Times,serif;color:#000;border:1px solid #000;padding:12mm 12mm 14mm;min-height:265mm}
  .p-page:last-child{page-break-after:auto}
  .p-head{text-align:center;margin-bottom:9mm}
  .p-head .l1{font-size:17pt;font-weight:700}
  .p-head .l2{font-size:15pt;font-weight:700;margin-top:1mm}
  .p-head .l3{font-size:15pt;font-weight:700;margin-top:1mm}
  .p-reg{display:flex;justify-content:space-between;font-size:11pt;margin-bottom:5mm}
  .p-row{display:grid;grid-template-columns:48mm 5mm 1fr;align-items:end;font-size:12pt;margin-bottom:3.2mm}
  .p-val{border-bottom:1px solid #000;min-height:6.5mm;padding:0 1mm 0.5mm;font-family:Arial,Helvetica,sans-serif;font-size:11pt}
  .p-sign{margin-top:14mm}
}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  #app.on{grid-template-columns:1fr}
  aside{flex-direction:row;align-items:center;padding:10px 12px;gap:8px;overflow-x:auto}
  .brand{border:0;margin:0;padding:0 8px 0 0}
  .brand span{display:none}
  .brand b{font-size:18px}
  .nav-btn{width:auto;white-space:nowrap}
  .side-foot{margin:0 0 0 auto;padding:0}
  .side-foot .who{display:none}
  .side-foot button{margin:0}
  main{padding:18px 14px 50px}
  .sheet{padding:22px 16px}
  .f-row{grid-template-columns:1fr;gap:0}
  .f-row .colon{display:none}
  .f-row label{font-size:14px;color:var(--ink-2);padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <h1>Operation Desk</h1>
    <p>United Way of Delhi · WED Project</p>
    <input type="password" id="pw" placeholder="Password" required autofocus>
    <div class="login-err" id="loginErr"></div>
    <button class="btn primary" style="width:100%" id="loginBtn">Open desk</button>
  </form>
</div>

<!-- App -->
<div id="app">
  <aside>
    <div class="brand"><b>Operation Desk</b><span>United Way of Delhi</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="modeLabel"></div>
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>
  <main>
    <div class="demo-bar" id="demoBar" style="display:none">
      Demo mode: data sirf is browser me save ho raha hai. Live chalane ke liye index.html me API_URL daalein.
    </div>
    <section id="view"></section>
  </main>
</div>

<div id="printArea"></div>
<div id="toast"></div>
<div id="busy">Saving…</div>

<script>
/* =========================================================
   TABS - naya tab add karna ho to yahan ek entry add karein
   aur Code.gs ke TABS me bhi same key ke saath.
   ========================================================= */
const TABS = [
  {
    key: "registration",
    title: "Registration Form",
    sub: "Skill training registrations",
    idField: "regNo",
    header: ["United Way Of Delhi", "Women Entrepreneurship Development Project", "Skill Training Registration Form"],
    listCols: ["regNo", "name", "courseName", "admissionDate", "contact"],
    fields: [
      { key: "courseName",       label: "Course Name" },
      { key: "admissionDate",    label: "Date Of Admission", type: "date" },
      { key: "name",             label: "Name Of Women", required: true },
      { key: "age",              label: "Age", type: "number" },
      { key: "guardian",         label: "Father / Husband Name" },
      { key: "presentAddress",   label: "Present Address", type: "textarea" },
      { key: "permanentAddress", label: "Permanent Address", type: "textarea" },
      { key: "aadhaar",          label: "Aadhar Card No" },
      { key: "pan",              label: "Pan Card No" },
      { key: "contact",          label: "Contact No", type: "tel" },
      { key: "caste",            label: "Cast" },
      { key: "rationCard",       label: "Ration Card No" },
      { key: "bankName",         label: "Bank Name" },
      { key: "accountNo",        label: "Account No" },
      { key: "qualification",    label: "Qualification" },
      { key: "maritalStatus",    label: "Marital Status" },
      { key: "business",         label: "Business" },
      { key: "personalIncome",   label: "Personal Income" },
      { key: "householdIncome",  label: "Household Income" }
    ]
  }
];

/* ---------------- State ---------------- */
const DEMO = !API_URL;
const DEMO_PASSWORD = "demo123";
const PW_KEY = "opdesk_pw";
let password = "";
let current = TABS[0];
let rows = {};          // { tabKey: [records] }
let editing = null;     // record being edited (null = new)
let query = "";

/* ---------------- Helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function fmtDate(v){
  if(!v) return "";
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : v;
}
function labelOf(tab, key){
  if(key === tab.idField) return "Reg. No";
  const f = tab.fields.find(f => f.key === key);
  return f ? f.label : key;
}
function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg; t.className = "on" + (isErr ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "", isErr ? 5000 : 2600);
}
function busy(on, text){ $("#busy").textContent = text || "Saving…"; $("#busy").classList.toggle("on", on); }

/* ---------------- API ---------------- */
async function api(action, payload = {}){
  if(DEMO) return demoApi(action, payload);
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action, password, ...payload })   // text/plain: no CORS preflight
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "Request failed");
  return data;
}

/* Demo backend (localStorage) - sirf testing ke liye */
function demoApi(action, p){
  const get = k => { try { return JSON.parse(localStorage.getItem("opdesk_demo_" + k) || "[]"); } catch(e){ return []; } };
  const set = (k, v) => { try { localStorage.setItem("opdesk_demo_" + k, JSON.stringify(v)); } catch(e){} };
  if(action !== "login" && password !== DEMO_PASSWORD) return Promise.reject(new Error("Wrong password"));
  if(action === "login"){
    return password === DEMO_PASSWORD ? Promise.resolve({ ok:true }) : Promise.reject(new Error("Galat password (demo: demo123)"));
  }
  const tab = TABS.find(t => t.key === p.tab); const list = get(p.tab);
  const now = new Date().toISOString();
  if(action === "list") return Promise.resolve({ ok:true, rows:list });
  if(action === "add"){
    let seq = 0; try { seq = +(localStorage.getItem("opdesk_demo_seq_" + p.tab) || 0); } catch(e){}
    seq++; try { localStorage.setItem("opdesk_demo_seq_" + p.tab, seq); } catch(e){}
    const rec = { ...p.record, [tab.idField]: "REG-" + String(seq).padStart(4, "0"), createdAt: now, updatedAt: now };
    list.push(rec); set(p.tab, list);
    return Promise.resolve({ ok:true, record:rec });
  }
  if(action === "update"){
    const i = list.findIndex(r => r[tab.idField] === p.id);
    if(i < 0) return Promise.reject(new Error("Record not found"));
    list[i] = { ...list[i], ...p.record, [tab.idField]: p.id, updatedAt: now }; set(p.tab, list);
    return Promise.resolve({ ok:true, record:list[i] });
  }
  if(action === "delete"){
    set(p.tab, list.filter(r => r[tab.idField] !== p.id));
    return Promise.resolve({ ok:true });
  }
  return Promise.reject(new Error("Unknown action"));
}

/* ---------------- Login ---------------- */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  password = $("#pw").value.trim();
  $("#loginBtn").disabled = true; $("#loginErr").textContent = "";
  try {
    await api("login");
    try { localStorage.setItem(PW_KEY, password); } catch(e){}
    startApp();
  } catch(err){
    $("#loginErr").textContent = err.message === "Wrong password" ? "Galat password" : err.message;
  } finally { $("#loginBtn").disabled = false; }
});
$("#logoutBtn").addEventListener("click", () => {
  try { localStorage.removeItem(PW_KEY); } catch(e){}
  location.reload();
});

async function autoLogin(){
  let saved = ""; try { saved = localStorage.getItem(PW_KEY) || ""; } catch(e){}
  if(DEMO) $("#pw").placeholder = "Password (demo: demo123)";
  if(!saved) return;
  password = saved;
  try { await api("login"); startApp(); }
  catch(e){ try { localStorage.removeItem(PW_KEY); } catch(_){} }
}

function startApp(){
  $("#login").style.display = "none";
  $("#app").classList.add("on");
  $("#demoBar").style.display = DEMO ? "block" : "none";
  $("#modeLabel").textContent = DEMO ? "Demo mode" : "Live · Google Sheet";
  renderNav(); openTab(TABS[0].key);
}

/* ---------------- Navigation ---------------- */
function renderNav(){
  $("#nav").innerHTML = TABS.map(t =>
    `<button class="nav-btn${t.key === current.key ? " active" : ""}" data-tab="${t.key}">${esc(t.title)}</button>`
  ).join("");
  $("#nav").querySelectorAll(".nav-btn").forEach(b => b.onclick = () => openTab(b.dataset.tab));
}
async function openTab(key){
  current = TABS.find(t => t.key === key); editing = null; query = "";
  renderNav(); renderList(true);
  await loadRows();
}
async function loadRows(){
  try {
    const d = await api("list", { tab: current.key });
    rows[current.key] = d.rows || [];
    renderList();
  } catch(err){ toast("Data load nahi hua: " + err.message, true); renderList(); }
}

/* ---------------- List view ---------------- */
function renderList(loading){
  const tab = current; const list = rows[tab.key] || [];
  const q = query.toLowerCase();
  const shown = list.filter(r => !q || Object.values(r).some(v => String(v).toLowerCase().includes(q)))
                    .slice().reverse();
  $("#view").innerHTML = `
    <div class="top">
      <div><h2>${esc(tab.title)}</h2><div class="sub">${esc(tab.sub)}</div></div>
      <div class="actions">
        <button class="btn" id="blankPrint">Print blank form</button>
        <button class="btn primary" id="newBtn">New registration</button>
      </div>
    </div>
    <div class="list-head">
      <input id="search" type="search" placeholder="Search by name, reg. no, contact, Aadhar…" value="${esc(query)}">
      <span class="count">${loading ? "Loading…" : `${shown.length} of ${list.length} registrations`}</span>
    </div>
    <div class="table-wrap">
      ${shown.length ? `<table>
        <thead><tr>${tab.listCols.map(c => `<th>${esc(labelOf(tab, c))}</th>`).join("")}<th></th></tr></thead>
        <tbody>${shown.map(r => `<tr>
          ${tab.listCols.map(c => `<td class="${c === tab.idField ? "reg" : ""}">${esc(c.toLowerCase().includes("date") ? fmtDate(r[c]) : r[c])}</td>`).join("")}
          <td class="row-act">
            <button class="btn sm" data-print="${esc(r[tab.idField])}">Print</button>
            <button class="btn sm" data-edit="${esc(r[tab.idField])}">Edit</button>
            <button class="btn sm danger" data-del="${esc(r[tab.idField])}">Delete</button>
          </td></tr>`).join("")}
        </tbody></table>`
      : `<div class="empty">${loading ? "Loading…" : (list.length ? "Is search se koi registration nahi mila." : "Abhi koi registration nahi hai. “New registration” se pehla student add karein.")}</div>`}
    </div>`;
  $("#newBtn").onclick = () => openEditor(null);
  $("#blankPrint").onclick = () => printRecords([null]);
  const s = $("#search");
  s.oninput = () => { query = s.value; const pos = s.selectionStart; renderList(); const n = $("#search"); n.focus(); n.setSelectionRange(pos, pos); };
  $("#view").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEditor(findRec(b.dataset.edit)));
  $("#view").querySelectorAll("[data-print]").forEach(b => b.onclick = () => printRecords([findRec(b.dataset.print)]));
  $("#view").querySelectorAll("[data-del]").forEach(b => b.onclick = () => removeRec(findRec(b.dataset.del)));
}
const findRec = id => (rows[current.key] || []).find(r => String(r[current.idField]) === String(id));

/* ---------------- Editor (paper-style form) ---------------- */
function openEditor(rec){
  editing = rec; const tab = current;
  const val = k => esc(rec ? rec[k] : "");
  const input = f => {
    const req = f.required ? "required" : "";
    if(f.type === "textarea") return `<textarea name="${f.key}" rows="1" ${req}>${val(f.key)}</textarea>`;
    return `<input name="${f.key}" type="${f.type || "text"}" value="${val(f.key)}" ${req} ${f.type === "tel" ? 'inputmode="tel"' : ""}>`;
  };
  $("#view").innerHTML = `
    <div class="editor-bar">
      <h3>${rec ? "Edit registration " + esc(rec[tab.idField]) : "New registration"}</h3>
      <button class="btn" id="backBtn">Back to list</button>
    </div>
    <form class="sheet" id="regForm" autocomplete="off">
      <div class="sheet-head">${tab.header.map((h, i) => `<div class="l${i + 1}">${esc(h)}</div>`).join("")}</div>
      <div class="sheet-reg"><span>Reg. No: ${rec ? esc(rec[tab.idField]) : "Save karne par milega"}</span></div>
      ${tab.fields.map(f => `<div class="f-row"><label for="f_${f.key}">${esc(f.label)}</label><span class="colon">:</span>${input(f).replace("name=", `id="f_${f.key}" name=`)}</div>`).join("")}
      <div class="f-row sign"><label>Signature</label><span class="colon">:</span><div class="sign-line"></div></div>
    </form>
    <div class="editor-foot">
      <button class="btn" id="cancelBtn">Cancel</button>
      ${rec ? `<button class="btn" id="printOne">Print</button>` : ""}
      <button class="btn primary" id="saveBtn">${rec ? "Save changes" : "Save registration"}</button>
    </div>`;
  $("#backBtn").onclick = $("#cancelBtn").onclick = () => { editing = null; renderList(); };
  if(rec) $("#printOne").onclick = () => printRecords([rec]);
  $("#saveBtn").onclick = saveRec;
  $("#regForm").addEventListener("submit", e => { e.preventDefault(); saveRec(); });
  $("#regForm").querySelectorAll("textarea").forEach(autoGrow);
  window.scrollTo(0, 0);
  setTimeout(() => $("#regForm").querySelector("input,textarea").focus(), 50);
}
function autoGrow(t){ const g = () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }; t.addEventListener("input", g); g(); }

async function saveRec(){
  const form = $("#regForm"); const tab = current;
  if(!form.reportValidity()) return;
  const record = {};
  tab.fields.forEach(f => record[f.key] = (form.elements[f.key].value || "").trim());
  $("#saveBtn").disabled = true; busy(true, "Saving…");
  try {
    let d;
    if(editing){ d = await api("update", { tab: tab.key, id: editing[tab.idField], record }); }
    else       { d = await api("add",    { tab: tab.key, record }); }
    const list = rows[tab.key] = rows[tab.key] || [];
    const i = list.findIndex(r => r[tab.idField] === d.record[tab.idField]);
    if(i >= 0) list[i] = d.record; else list.push(d.record);
    toast(editing ? `Saved changes to ${d.record[tab.idField]}` : `Saved registration ${d.record[tab.idField]}`);
    if(d.warning) setTimeout(() => toast(d.warning, true), 2700);
    openEditor(d.record);
  } catch(err){ toast("Save nahi hua: " + err.message, true); }
  finally { busy(false); const b = $("#saveBtn"); if(b) b.disabled = false; }
}

async function removeRec(rec){
  if(!rec) return; const tab = current; const id = rec[tab.idField];
  if(!confirm(`Delete ${id} – ${rec.name || ""}?\n\nSheet se hat jayega. GitHub history me backup rahega.`)) return;
  busy(true, "Deleting…");
  try {
    const d = await api("delete", { tab: tab.key, id });
    rows[tab.key] = (rows[tab.key] || []).filter(r => r[tab.idField] !== id);
    toast(`Deleted ${id}`); renderList();
    if(d.warning) setTimeout(() => toast(d.warning, true), 2700);
  } catch(err){ toast("Delete nahi hua: " + err.message, true); }
  finally { busy(false); }
}

/* ---------------- Print (same as paper form) ---------------- */
function printRecords(recs){
  const tab = current;
  $("#printArea").innerHTML = recs.map(rec => {
    const v = f => {
      const x = rec ? rec[f.key] : "";
      return esc(f.type === "date" ? fmtDate(x) : x);
    };
    return `<div class="p-page">
      <div class="p-head">${tab.header.map((h, i) => `<div class="l${i + 1}">${esc(h)}</div>`).join("")}</div>
      <div class="p-reg"><span>Reg. No: ${rec ? esc(rec[tab.idField]) : "________________"}</span><span></span></div>
      ${tab.fields.map(f => `<div class="p-row"><span>${esc(f.label)}</span><span>:</span><div class="p-val">${v(f)}</div></div>`).join("")}
      <div class="p-row p-sign"><span>Signature</span><span>:</span><div class="p-val"></div></div>
    </div>`;
  }).join("");
  setTimeout(() => window.print(), 50);
}

autoLogin();
